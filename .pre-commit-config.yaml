
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatting
        entry: python -m ruff format
        language: system
        types: [python, jupyter]

      - id: ruff-format-notebook
        name: Ruff formatting (Jupyter notebooks)
        entry:  python -m ruff format
        language: system
        files: \.ipynb$